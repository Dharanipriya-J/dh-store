{% extends "base.html" %}
{% block title %}Admin Login - DH STORE{% endblock %}
{% block content %}

<div class="auth-wrap">
  <div class="auth-card">
    <h1>Admin Login</h1>
    <p class="auth-card__sub">Behavioral analytics dashboard</p>

    <form method="post" action="{{ url_for('admin_login') }}">
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="Enter username" required autofocus>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter admin password" required>
      </div>
      <button type="submit" class="btn btn--purple btn--full">Enter Dashboard</button>
    </form>
  </div>
</div>

{% endblock %}
